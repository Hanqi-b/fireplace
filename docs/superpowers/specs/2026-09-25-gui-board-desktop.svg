<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
  <title id="title">桌面战场布局草图</title>
  <desc id="desc">对手在上、我方在下，四角为装饰贴图，中央是两排随从；结束回合在右侧，手牌沿下缘，记录与备用动作在战场下方。</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1"><stop stop-color="#15203b"/><stop offset="1" stop-color="#070e1d"/></linearGradient>
    <linearGradient id="frame" x2="0" y2="1"><stop stop-color="#ad8d56"/><stop offset=".35" stop-color="#51402d"/><stop offset="1" stop-color="#c39b55"/></linearGradient>
    <linearGradient id="felt" x2=".1" y2="1"><stop stop-color="#635b65"/><stop offset=".5" stop-color="#535266"/><stop offset="1" stop-color="#4a505e"/></linearGradient>
    <linearGradient id="moss" x2="0" y2="1"><stop stop-color="#245668"/><stop offset="1" stop-color="#172a41"/></linearGradient>
    <linearGradient id="ice" x2="0" y2="1"><stop stop-color="#2d627f"/><stop offset="1" stop-color="#182e56"/></linearGradient>
    <linearGradient id="forge" x2="0" y2="1"><stop stop-color="#87472b"/><stop offset="1" stop-color="#29243a"/></linearGradient>
    <linearGradient id="arcane" x2="0" y2="1"><stop stop-color="#3e5488"/><stop offset="1" stop-color="#2a244d"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#63788f"/><stop offset=".48" stop-color="#323e5a"/><stop offset="1" stop-color="#1a253a"/></linearGradient>
    <pattern id="planks" width="92" height="28" patternUnits="userSpaceOnUse"><rect width="92" height="28" fill="none"/><path d="M0 27H92M45 0V27" stroke="#b4c7d9" stroke-opacity=".08" stroke-width="2"/></pattern>
    <pattern id="stone" width="110" height="75" patternUnits="userSpaceOnUse"><path d="M0 73H110M20 0L12 73M84 0L95 73" stroke="#f0e9d1" stroke-opacity=".07" stroke-width="2" fill="none"/></pattern>
    <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#f5f0dd} .small{font-size:15px;fill:#c7d6df}.tiny{font-size:12px;fill:#d7e0e6}.label{font-size:18px;font-weight:700}.number{font-size:24px;font-weight:900;paint-order:stroke;stroke:#1c202b;stroke-width:4}.cardname{font-size:14px;font-weight:700}.muted{fill:#aeb9c3}</style>
  </defs>
  <rect width="1440" height="1100" fill="url(#night)"/>
  <text x="45" y="30" class="small">FIREPLACE · 战场式界面草图 / 桌面</text>

  <!-- Scene frame and the four decorative texture slots. -->
  <rect x="35" y="46" width="1370" height="745" rx="38" fill="url(#frame)" stroke="#e5c27b" stroke-width="5" filter="url(#shadow)"/>
  <rect x="49" y="59" width="1342" height="719" rx="30" fill="#172743"/>
  <rect x="49" y="59" width="1342" height="719" rx="30" fill="url(#planks)"/>
  <path d="M63 77H310V260H230L150 330H63Z" fill="url(#moss)" stroke="#79a8a6" stroke-width="4"/>
  <path d="M1377 77H1130V260H1210L1290 330H1377Z" fill="url(#ice)" stroke="#9bc7da" stroke-width="4"/>
  <path d="M63 766H310V596H230L150 526H63Z" fill="url(#forge)" stroke="#b48060" stroke-width="4"/>
  <path d="M1377 766H1130V596H1210L1290 526H1377Z" fill="url(#arcane)" stroke="#9c9cd4" stroke-width="4"/>
  <circle cx="154" cy="167" r="82" fill="none" stroke="#90d1bd" stroke-opacity=".4" stroke-width="17"/>
  <circle cx="1282" cy="169" r="87" fill="none" stroke="#bbecf5" stroke-opacity=".38" stroke-width="16"/>
  <circle cx="155" cy="669" r="75" fill="none" stroke="#f6a45d" stroke-opacity=".42" stroke-width="20"/>
  <circle cx="1284" cy="669" r="87" fill="none" stroke="#b7b9ff" stroke-opacity=".38" stroke-width="16"/>
  <text x="104" y="280" class="tiny">左上场景贴图</text>
  <text x="1219" y="280" class="tiny">右上场景贴图</text>
  <text x="105" y="625" class="tiny">左下场景贴图</text>
  <text x="1219" y="625" class="tiny">右下场景贴图</text>

  <!-- Central playmat stays visually quiet so cards and targets remain legible. -->
  <path d="M310 176Q720 105 1130 176L1213 288V568L1128 681Q720 755 312 681L227 568V288Z" fill="url(#felt)" stroke="#d0b783" stroke-width="8"/>
  <path d="M310 176Q720 105 1130 176L1213 288V568L1128 681Q720 755 312 681L227 568V288Z" fill="url(#stone)"/>
  <path d="M285 427Q720 438 1155 427" fill="none" stroke="#c5c5ca" stroke-opacity=".44" stroke-width="4" stroke-dasharray="12 9"/>
  <text x="666" y="454" class="small" fill="#d4d3d5">中央战场</text>

  <!-- Opponent hand, hero, power, minions and public counts. -->
  <g fill="#523b32" stroke="#dfab65" stroke-width="3">
    <rect x="530" y="62" width="55" height="78" rx="9" transform="rotate(-17 558 101)"/>
    <rect x="585" y="56" width="55" height="78" rx="9" transform="rotate(-9 612 95)"/>
    <rect x="641" y="54" width="55" height="78" rx="9"/>
    <rect x="697" y="54" width="55" height="78" rx="9"/>
    <rect x="753" y="56" width="55" height="78" rx="9" transform="rotate(9 780 95)"/>
    <rect x="808" y="62" width="55" height="78" rx="9" transform="rotate(17 835 101)"/>
  </g>
  <text x="882" y="95" class="small">对手暗手：只显示数量</text>
  <circle cx="719" cy="182" r="67" fill="#282b46" stroke="#e1c074" stroke-width="11" filter="url(#shadow)"/>
  <circle cx="719" cy="182" r="53" fill="#544364"/>
  <text x="694" y="193" font-size="31" font-weight="800">敌</text>
  <circle cx="805" cy="183" r="36" fill="#384861" stroke="#d3ad68" stroke-width="7"/>
  <text x="789" y="190" class="small">技能</text>
  <circle cx="775" cy="238" r="25" fill="#9c272e" stroke="#e6c983" stroke-width="4"/>
  <text x="765" y="246" class="number">30</text>
  <text x="1023" y="180" class="small">对手法力  3 / 3</text>
  <text x="1030" y="205" class="tiny">牌库 · 武器 · 奥秘按公开信息显示</text>
  <text x="555" y="293" class="tiny">对手随从区（最多七个）</text>
  <g filter="url(#shadow)">
    <rect x="615" y="308" width="90" height="110" rx="22" fill="url(#card)" stroke="#c8ae7c" stroke-width="5"/>
    <rect x="725" y="308" width="90" height="110" rx="22" fill="url(#card)" stroke="#c8ae7c" stroke-width="5"/>
  </g>
  <text x="641" y="368" class="label">随从</text><text x="751" y="368" class="label">随从</text>
  <text x="619" y="411" class="number">3</text><text x="676" y="411" class="number">4</text>
  <text x="729" y="411" class="number">2</text><text x="786" y="411" class="number">2</text>

  <!-- Own side. -->
  <text x="533" y="489" class="tiny">我方随从区（最多七个）</text>
  <g filter="url(#shadow)">
    <rect x="560" y="505" width="90" height="108" rx="22" fill="url(#card)" stroke="#93e1c1" stroke-width="5"/>
    <rect x="665" y="505" width="90" height="108" rx="22" fill="url(#card)" stroke="#93e1c1" stroke-width="5"/>
    <rect x="770" y="505" width="90" height="108" rx="22" fill="url(#card)" stroke="#93e1c1" stroke-width="5"/>
  </g>
  <text x="585" y="565" class="label">随从</text><text x="690" y="565" class="label">随从</text><text x="795" y="565" class="label">随从</text>
  <text x="565" y="606" class="number">4</text><text x="623" y="606" class="number">4</text>
  <text x="670" y="606" class="number">2</text><text x="728" y="606" class="number">3</text>
  <text x="775" y="606" class="number">5</text><text x="833" y="606" class="number">5</text>
  <circle cx="719" cy="640" r="65" fill="#24384d" stroke="#e1c074" stroke-width="11" filter="url(#shadow)"/>
  <text x="695" y="653" font-size="31" font-weight="800">我</text>
  <circle cx="807" cy="640" r="37" fill="#356f73" stroke="#d3ad68" stroke-width="7"/>
  <text x="791" y="647" class="small">技能</text>
  <circle cx="775" cy="697" r="25" fill="#9c272e" stroke="#e6c983" stroke-width="4"/>
  <text x="765" y="705" class="number">29</text>
  <text x="1055" y="734" class="small">我方法力  3 / 3</text>
  <text x="1110" y="758" class="tiny">牌库 24</text>

  <!-- Game controls live in the scene, unlike diagnostics. -->
  <rect x="1210" y="388" width="157" height="70" rx="19" fill="#386b57" stroke="#ecc978" stroke-width="8" filter="url(#shadow)"/>
  <text x="1247" y="431" class="label">结束回合</text>
  <rect x="72" y="475" width="140" height="45" rx="12" fill="#163048" stroke="#89cdbb" stroke-width="2"/>
  <text x="84" y="503" class="small">阶段 · 主阶段</text>
  <rect x="72" y="538" width="143" height="43" rx="12" fill="#182f48" stroke="#6d95a6" stroke-width="2"/>
  <text x="83" y="566" class="small">可用操作  ▾</text>
  <text x="93" y="703" class="tiny">快捷操作在此展开；</text>
  <text x="93" y="723" class="tiny">点卡牌也可直接操作</text>

  <!-- Fan of playable cards; card faces are placeholders in the design. -->
  <g filter="url(#shadow)">
    <g transform="rotate(-16 530 776)"><rect x="490" y="725" width="82" height="123" rx="10" fill="url(#card)" stroke="#d5b46b" stroke-width="5"/><text x="511" y="808" class="cardname">卡牌一</text></g>
    <g transform="rotate(-8 620 773)"><rect x="578" y="715" width="84" height="129" rx="10" fill="url(#card)" stroke="#d5b46b" stroke-width="5"/><text x="598" y="807" class="cardname">卡牌二</text></g>
    <rect x="672" y="711" width="88" height="133" rx="10" fill="url(#card)" stroke="#96dcb9" stroke-width="5"/>
    <text x="690" y="809" class="cardname">可出手牌</text>
    <g transform="rotate(8 810 773)"><rect x="771" y="715" width="84" height="129" rx="10" fill="url(#card)" stroke="#d5b46b" stroke-width="5"/><text x="790" y="807" class="cardname">卡牌四</text></g>
    <g transform="rotate(16 900 776)"><rect x="866" y="725" width="82" height="123" rx="10" fill="url(#card)" stroke="#d5b46b" stroke-width="5"/><text x="885" y="808" class="cardname">卡牌五</text></g>
  </g>
  <text x="992" y="824" class="tiny">手牌 hover/焦点放大</text>

  <!-- Auxiliary content follows below the first-screen board. -->
  <text x="52" y="899" class="small">↓ 向下滚动：非战场信息</text>
  <rect x="45" y="917" width="1350" height="78" rx="17" fill="#14263b" stroke="#3c5b69" stroke-width="2"/>
  <text x="71" y="949" class="label">对局记录</text>
  <text x="71" y="978" class="small">最近事件摘要 · 点击展开完整公开记录</text>
  <rect x="45" y="1009" width="1350" height="66" rx="17" fill="#122034" stroke="#3c5b69" stroke-width="2"/>
  <text x="71" y="1049" class="label">全部合法动作（备用） ▸</text>
  <text x="369" y="1049" class="small">默认折叠；主战场保留直接操作与快捷入口</text>
</svg>
