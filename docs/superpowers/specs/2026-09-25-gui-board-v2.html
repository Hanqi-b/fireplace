<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fireplace · 战场视觉稿</title>
  <style>
    :root{color-scheme:dark;font-family:"Noto Sans CJK SC",sans-serif;--gold:#eac17b;--ink:#e8dfca;--mana:#8cd9ff;--green:#8ded7d;--glow:0 0 14px #85e15c,0 0 28px #58b84690}
    *{box-sizing:border-box}body{margin:0;background:#10131e;color:var(--ink)}button{font:inherit;cursor:pointer}
    .page{width:100%;min-height:100vh;background:radial-gradient(circle at 50% 18%,#30395d,#10131e 72%)}
    .board{position:relative;width:min(100vw,1680px);aspect-ratio:1680/928;margin:auto;overflow:hidden;isolation:isolate;background:#4b4753 url("assets/gui-board-scene.webp") center/100% 100% no-repeat;box-shadow:0 20px 90px #000b}
    .board:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#05091355,transparent 19%,transparent 76%,#05091145)}
    .board button{border:0;color:#f9e7b7;position:absolute;z-index:5}
    .top-ribbon{position:absolute;z-index:2;display:flex;align-items:center;gap:9px;padding:7px 16px;border:2px solid #b18a59;border-radius:999px;background:linear-gradient(#352f30,#171c28);box-shadow:inset 0 1px 2px #f9e5ad66,0 4px 12px #0009;font-weight:700;letter-spacing:.08em;text-shadow:0 2px #000;left:23%;top:2.5%;font-size:15px}
    .status-dot{width:10px;height:10px;border-radius:50%;background:#eebc62;box-shadow:0 0 9px #eebc62}
    .enemy-hand{position:absolute;z-index:3;top:-3.7%;left:50%;transform:translateX(-50%);display:flex;gap:0;filter:drop-shadow(0 8px 6px #000a)}
    .cardback{width:51px;height:79px;margin-left:-16px;transform-origin:50% 0;transform:rotate(calc((var(--i) - 2) * 7deg));border:4px ridge #bd8e50;border-radius:10px;background:radial-gradient(circle,#288b9a 0 14%,#b59c65 15% 19%,#253d5e 20% 45%,#5b263c 46% 65%,#1b2030 66%);box-shadow:inset 0 0 0 2px #251518,0 3px 5px #000d}
    .enemy-hand-count{position:absolute;z-index:5;top:4%;left:57.5%;font-size:15px;font-weight:800;background:#201d24df;border:1px solid #bd8e50;border-radius:20px;padding:1px 10px}
    .hero{position:absolute;z-index:4;width:9.1%;aspect-ratio:1;filter:drop-shadow(0 7px 5px #000d)}
    .hero.enemy{top:7.8%;left:45.4%}.hero.self{bottom:8.4%;left:45.4%}
    .hero .portrait{position:absolute;inset:11%;border-radius:48% 48% 40% 40%;background-image:var(--asset);background-size:220% auto;background-position:center 22%;border:4px solid #241c20;box-shadow:inset 0 0 15px #000a}
    .hero .rim{position:absolute;inset:0;border-radius:48% 48% 42% 42%;border:12px ridge #a77a39;box-shadow:inset 0 0 0 3px #e5c681,0 0 0 3px #30211c,0 4px 14px #000c}
    .hero .name{position:absolute;left:-8%;right:-8%;bottom:-11%;text-align:center;font-family:"Noto Serif CJK SC",serif;font-size:17px;font-weight:900;color:#fff5d9;text-shadow:0 2px 3px #000,0 0 8px #000}
    .hero .health{position:absolute;right:-9%;bottom:-6%;width:38px;height:38px;display:grid;place-items:center;border:3px ridge #efb9a3;background:radial-gradient(circle at 30% 22%,#f88b83,#7f161e 75%);clip-path:polygon(50% 0,93% 18%,88% 66%,50% 100%,12% 66%,7% 18%);font-size:22px;font-weight:900;text-shadow:0 2px #000}
    .hero-power{width:5.4%;aspect-ratio:1;top:15.5%;left:55.7%;border-radius:50%;border:6px ridge #bb914f!important;background:#172345 var(--asset) center 23%/220% auto no-repeat!important;box-shadow:inset 0 0 9px #000,0 4px 9px #0009;font-size:27px!important}.hero-power.self{top:auto;bottom:11.1%;left:55.7%;box-shadow:inset 0 0 9px #000,0 0 15px #9be68170,0 4px 9px #000a}.hero-power .cost{position:absolute;top:-15px;left:0;width:25px;height:25px;border:2px solid #d5ccba;border-radius:50%;background:#167ac5;display:grid;place-items:center;font-size:18px;font-weight:900}
    .weapon{position:absolute;z-index:5;left:38.5%;bottom:17%;width:6%;aspect-ratio:1;border:7px ridge #ba8d4a;border-radius:50%;background:#172033 var(--asset) center 24%/230% auto no-repeat;box-shadow:inset 0 0 8px #000b,0 5px 9px #000b}.weapon .stats{position:absolute;bottom:-10px;left:-12px;right:-12px;display:flex;justify-content:space-between;font-size:18px;font-weight:900;text-shadow:0 2px #000}.weapon .stats span{width:29px;height:29px;display:grid;place-items:center;border:2px solid #d6b46d;border-radius:50%;background:#59452a}.weapon .stats span:last-child{background:#335d79}
    .mana{position:absolute;z-index:4;display:flex;gap:3px;align-items:center;font-size:17px;font-weight:900;text-shadow:0 2px #000}.mana.enemy{top:6%;left:62%}.mana.self{bottom:6.8%;left:61%}.mana b{padding:2px 8px;background:#173e5c;border:2px ridge #76a4c7;border-radius:20px}.crystal{width:16px;height:20px;background:linear-gradient(135deg,#dcffff 0%,#7bd7fc 28%,#1c6cae 72%,#0b2548);clip-path:polygon(50% 0,91% 20%,75% 86%,50% 100%,25% 86%,9% 20%);filter:drop-shadow(0 0 3px #63c8ff)}.crystal.empty{filter:none;opacity:.35}
    .deck{position:absolute;z-index:2;right:11.9%;width:5%;aspect-ratio:.72;border:6px ridge #a67c42;border-radius:8px;background:radial-gradient(circle,#59a5a6,#20395c 37%,#843e3d 40%,#292033 70%);box-shadow:7px -5px 0 #624729,11px -8px 0 #a17a43,0 6px 11px #000c}.deck.enemy{top:20%}.deck.self{bottom:21%}.deck span{position:absolute;right:-18px;bottom:-12px;background:#1e2228;border:2px solid #c39d61;border-radius:50%;min-width:31px;padding:3px;text-align:center;font-weight:900}
    .minion-row{position:absolute;z-index:4;display:flex;justify-content:center;align-items:center;gap:1.2%;left:22%;width:56%;height:16%;}.minion-row.enemy{top:29%}.minion-row.self{bottom:30%}
    .minion{position:relative;flex:none;width:12%;aspect-ratio:.85;border-radius:44% 44% 38% 38%;border:6px ridge #bb9352;background:#241e27;box-shadow:inset 0 0 9px #000,0 4px 9px #000a;transform:translateY(var(--offset,0))}.minion .art{position:absolute;inset:4%;border-radius:42% 42% 34% 34%;background-image:var(--asset);background-size:240% auto;background-position:center 23%}.minion .stats{position:absolute;bottom:-13%;left:-11%;right:-11%;display:flex;justify-content:space-between;font-weight:900;font-size:23px;text-shadow:0 2px 3px #000,0 0 4px #000}.attack{color:#fbe6a8}.hp{color:#ffddd5}.bubble{border:2px solid #e5bc6c;border-radius:50%;width:33px;height:33px;display:grid;place-items:center;background:#322b2b}.bubble.hp{background:#992928}.minion.ready{box-shadow:inset 0 0 9px #000,0 0 0 3px #7fe45b,var(--glow)}.minion.target{box-shadow:inset 0 0 9px #000,0 0 0 4px #f7c467,0 0 24px #ffbe50}.minion.target:after{content:"合法目标";position:absolute;top:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#311f1ad9;color:#ffe5ad;border:1px solid #f8bb60;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:800}
    .slot{width:9%;height:73%;border:2px dashed #eac36eaa;border-radius:50%;background:#edc77119;box-shadow:0 0 17px #deb65b55;display:grid;place-items:center;color:#ffe7a8;text-shadow:0 2px #000;font-size:12px;font-weight:800;text-align:center}
    .turn-btn{right:11.8%;top:47%;width:9%;height:7.4%;border:5px ridge #eac17b!important;border-radius:26% 26% 30% 30%/50%!important;background:linear-gradient(#ffeca4,#b78027 48%,#63451d)!important;box-shadow:inset 0 1px 8px #fff8,0 5px 12px #000c,0 0 15px #dbb96b88!important;color:#342319!important;font-family:"Noto Serif CJK SC",serif!important;font-size:20px!important;font-weight:900!important;text-shadow:0 1px #fff6!important}.turn-btn:hover{filter:brightness(1.15)}
    .turn-badge{position:absolute;z-index:4;left:9%;top:47%;padding:6px 12px;border:2px ridge #b38b51;border-radius:20px;background:#1f2935df;font-size:13px;font-weight:800;text-shadow:0 2px #000}.turn-badge strong{color:#a9e6ff}
    .hand{position:absolute;z-index:8;left:22%;bottom:-10%;width:58%;height:32%;display:flex;justify-content:center;align-items:flex-end;filter:drop-shadow(0 7px 9px #000c)}
    .card{position:relative;flex:none;width:17%;height:95%;margin-left:-2.2%;background:transparent;filter:drop-shadow(0 5px 6px #000d);transform-origin:50% 125%;transform:rotate(var(--r)) translateY(var(--y));transition:transform .16s}.card:hover{z-index:20;transform:rotate(0) translateY(-62%) scale(1.25)}.card .art{position:absolute;inset:0;background-image:var(--asset);background-size:contain;background-position:center;background-repeat:no-repeat}.card .cost,.card .title,.card .body{display:none}.card.playable{filter:drop-shadow(0 0 7px #77e65c) drop-shadow(0 5px 6px #000d)}
    .hint{position:absolute;z-index:7;bottom:26.7%;left:50%;transform:translateX(-50%);padding:6px 15px;background:#1e2432e8;border:2px solid #c69e5c;border-radius:999px;font-size:13px;font-weight:800;text-align:center;box-shadow:0 5px 10px #0009}.hint em{font-style:normal;color:#a1e8ff}
    .side-info{position:absolute;z-index:3;bottom:8%;left:8%;width:15%;padding:7px 10px;border:2px ridge #a5814d;border-radius:10px;background:#171a26d9;box-shadow:0 3px 8px #0009;font-size:12px;line-height:1.7;text-shadow:0 1px #000}.side-info b{color:#c9e9ff}
    .below{max-width:1680px;margin:auto;padding:22px 30px 45px;display:grid;grid-template-columns:1.5fr 1fr;gap:18px;background:#151927}.panel{border:2px solid #5f4a36;border-radius:10px;background:#242633;padding:16px 22px;box-shadow:inset 0 1px #a8895c55}.panel h2{font:900 18px "Noto Serif CJK SC",serif;color:#f4d395;margin:0 0 10px}.panel p{margin:5px 0;font-size:14px}.panel summary{cursor:pointer;color:#edd6a4;font-weight:800}.muted{color:#acb2c4}
    @media(max-width:760px){.board{width:100%;height:690px;aspect-ratio:auto;background-size:auto 100%;background-position:center}.top-ribbon{left:4%;top:2%;font-size:11px}.bottom-ribbon{left:4%;bottom:2%;font-size:11px}.enemy-hand{top:0;left:64%;transform:translateX(-50%) scale(.72)}.enemy-hand-count{top:2%;left:82%;font-size:11px}.hero{width:22%}.hero.enemy{top:8%;left:39%}.hero.self{bottom:17%;left:39%}.hero .rim{border-width:8px}.hero .name{font-size:12px}.hero .health{width:29px;height:29px;font-size:16px}.hero-power{width:13%;top:13%;left:66%;font-size:20px!important}.hero-power.self{bottom:19%;left:66%;top:auto}.hero-power .cost{width:20px;height:20px;font-size:13px;top:-10px}.weapon{left:21%;bottom:20%;width:14%;border-width:4px}.weapon .stats{font-size:12px;bottom:-7px;left:-7px;right:-7px}.weapon .stats span{width:21px;height:21px;border-width:1px}.mana.enemy{top:24%;left:28%;font-size:11px}.mana.self{bottom:15%;left:27%;font-size:11px}.crystal{width:10px;height:13px}.deck{width:9%;right:6%}.deck.enemy{top:29%}.deck.self{bottom:30%}.deck span{font-size:10px;min-width:20px;right:-12px;bottom:-8px}.minion-row{left:5%;width:90%;height:75px;gap:2%}.minion-row.enemy{top:31%}.minion-row.self{bottom:34%}.minion{width:15%;border-width:3px}.minion .stats{font-size:12px}.bubble{width:22px;height:22px;border-width:1px}.minion.target:after{font-size:8px;top:-17px}.slot{width:12%;font-size:8px}.turn-btn{right:2%;top:49%;width:25%;height:45px;border-width:3px!important;font-size:14px!important}.turn-badge{left:3%;top:49%;font-size:10px;padding:4px 7px}.hand{bottom:0%;left:2%;width:96%;height:135px;overflow:visible;justify-content:center}.card{height:120px;width:66px;margin-left:-6px;transform:rotate(0);transform-origin:50% 100%}.card:hover{transform:translateY(-22%) scale(1.15)}.hint{bottom:28%;font-size:10px;width:max-content;max-width:94%}.side-info{left:3%;bottom:17%;font-size:9px;width:23%;padding:3px 5px}.below{display:block;padding:12px}.panel{margin-bottom:12px;padding:12px}.panel h2{font-size:15px}.panel p{font-size:12px}}
  </style>
</head>
<body><main class="page">
  <section class="board" aria-label="静态战场设计预览">
    <div class="top-ribbon"><span class="status-dot"></span>对手 · 德鲁伊</div>
    <div class="enemy-hand" aria-label="对手手牌 5 张"><span class="cardback" style="--i:0"></span><span class="cardback" style="--i:1"></span><span class="cardback" style="--i:2"></span><span class="cardback" style="--i:3"></span><span class="cardback" style="--i:4"></span></div><div class="enemy-hand-count">手牌 5</div>
    <div class="hero enemy" style="--asset:url('/assets/render/HERO_06')"><div class="portrait"></div><div class="rim"></div><div class="name">林地守护者</div><div class="health">30</div></div>
    <button class="hero-power" style="--asset:url('/assets/render/HERO_06bp')" aria-label="对手英雄技能"><span class="cost">2</span></button>
    <div class="mana enemy"><b>3/3</b><span class="crystal"></span><span class="crystal"></span><span class="crystal"></span></div>
    <div class="deck enemy"><span>24</span></div>
    <div class="minion-row enemy"><div class="minion target" style="--asset:url('/assets/render/EX1_112')"><div class="art"></div><div class="stats"><span class="bubble attack">3</span><span class="bubble hp">4</span></div></div><div class="minion" style="--asset:url('/assets/render/CS2_231')"><div class="art"></div><div class="stats"><span class="bubble attack">2</span><span class="bubble hp">2</span></div></div></div>
    <div class="turn-badge">第 <strong>4</strong> 回合 · 我的行动</div>
    <button class="turn-btn">结束回合</button>
    <div class="minion-row self"><div class="minion ready" style="--asset:url('/assets/render/EX1_050')"><div class="art"></div><div class="stats"><span class="bubble attack">2</span><span class="bubble hp">3</span></div></div><div class="slot">召唤<br>位置</div><div class="minion ready" style="--asset:url('/assets/render/CS2_231')"><div class="art"></div><div class="stats"><span class="bubble attack">1</span><span class="bubble hp">2</span></div></div></div>
    <div class="weapon" style="--asset:url('/assets/render/CS2_082')" aria-label="我方武器：1 攻击，2 耐久"><div class="stats"><span>1</span><span>2</span></div></div>
    <div class="hero self" style="--asset:url('/assets/render/HERO_08')"><div class="portrait"></div><div class="rim"></div><div class="name">霜语法师</div><div class="health">28</div></div>
    <button class="hero-power self" style="--asset:url('/assets/render/HERO_08bp')" aria-label="使用英雄技能"><span class="cost">2</span></button>
    <div class="mana self"><b>4/4</b><span class="crystal"></span><span class="crystal"></span><span class="crystal"></span><span class="crystal"></span></div>
    <div class="deck self"><span>23</span></div>
    <div class="side-info">我方手牌 <b>6</b> 张<br>牌库 <b>23</b> 张<br>可行动随从 <b>2</b></div>
    <div class="hint">已选中 <em>冰霜裂隙</em> · 请选择高亮目标，或按 Esc 取消</div>
    <div class="hand">
      <div class="card playable" style="--asset:url('/assets/render/CS2_029');--r:-20deg;--y:12px"><div class="art"></div></div>
      <div class="card playable" style="--asset:url('/assets/render/CS2_082');--r:-13deg;--y:4px"><div class="art"></div></div>
      <div class="card playable" style="--asset:url('/assets/render/CS2_231');--r:-6deg;--y:0"><div class="art"></div></div>
      <div class="card playable" style="--asset:url('/assets/render/EX1_050');--r:4deg;--y:0"><div class="art"></div></div>
      <div class="card" style="--asset:url('/assets/render/EX1_112');--r:12deg;--y:4px"><div class="art"></div></div>
      <div class="card" style="--asset:url('/assets/render/NEW1_038');--r:20deg;--y:12px"><div class="art"></div></div>
    </div>
  </section>
  <div class="below"><section class="panel"><h2>对局记录</h2><p><span class="muted">第 4 回合</span>　你抽到「冰霜裂隙」</p><p><span class="muted">第 3 回合</span>　对手召唤「金盾守卫」</p><p><span class="muted">第 3 回合</span>　「寒冰元素」攻击对方英雄，造成 2 点伤害</p></section><section class="panel"><h2>备用操作</h2><details><summary>展开全部合法动作（仅作备用）</summary><p>出牌 · 攻击 · 英雄技能 · 结束回合</p></details><p class="muted">设计稿；该区域在正式页面中由当前合法动作生成。</p></section></div>
</main></body></html>
