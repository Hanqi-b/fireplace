<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1080" role="img" aria-labelledby="title desc">
  <title id="title">窄屏战场布局草图</title>
  <desc id="desc">手机宽度保留对手在上、我方在下的战场顺序，卡牌横向滚动；四角贴图裁切成细边，日志与备用动作在游戏界面下方。</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#112c47"/><stop offset="1" stop-color="#081425"/></linearGradient>
    <linearGradient id="felt" x2="0" y2="1"><stop stop-color="#625d6b"/><stop offset="1" stop-color="#4b5160"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#71869a"/><stop offset="1" stop-color="#25334a"/></linearGradient>
    <style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#f8f1dd}.s{font-size:12px}.m{font-size:15px;font-weight:700}.n{font-size:18px;font-weight:900;paint-order:stroke;stroke:#1c2230;stroke-width:3}</style>
  </defs>
  <rect width="390" height="1080" fill="url(#bg)"/>
  <text x="17" y="29" class="s">FIREPLACE · 窄屏战场草图</text>
  <rect x="10" y="45" width="370" height="765" rx="20" fill="#a88352" stroke="#e1be79" stroke-width="3"/>
  <rect x="17" y="52" width="356" height="751" rx="16" fill="url(#felt)"/>
  <path d="M17 52H110V187H17Z" fill="#245166" opacity=".8"/>
  <path d="M373 52H280V187H373Z" fill="#294c70" opacity=".8"/>
  <path d="M17 803H110V655H17Z" fill="#6a3e34" opacity=".8"/>
  <path d="M373 803H280V655H373Z" fill="#434d83" opacity=".8"/>
  <text x="28" y="73" class="s">贴图裁切</text><text x="306" y="73" class="s">贴图裁切</text>

  <g fill="#4c3935" stroke="#d3a963" stroke-width="2">
    <rect x="91" y="68" width="27" height="41" rx="5"/>
    <rect x="123" y="66" width="27" height="41" rx="5"/>
    <rect x="155" y="65" width="27" height="41" rx="5"/>
    <rect x="187" y="65" width="27" height="41" rx="5"/>
    <rect x="219" y="66" width="27" height="41" rx="5"/>
    <rect x="251" y="68" width="27" height="41" rx="5"/>
