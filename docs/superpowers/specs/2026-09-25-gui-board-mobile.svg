  <text x="175" y="178" font-size="23" font-weight="800">敌</text>
  <circle cx="243" cy="171" r="24" fill="#3e536c" stroke="#c4a767" stroke-width="4"/>
  <text x="229" y="176" class="s">技能</text>
  <circle cx="217" cy="207" r="18" fill="#982e35" stroke="#e8c373" stroke-width="3"/>
  <text x="208" y="213" class="n">30</text>
  <text x="29" y="217" class="s">对手法力 3/3</text>
  <text x="26" y="255" class="s">对手随从</text>
  <rect x="105" y="264" width="75" height="88" rx="17" fill="url(#card)" stroke="#e1c280" stroke-width="4"/>
  <rect x="207" y="264" width="75" height="88" rx="17" fill="url(#card)" stroke="#e1c280" stroke-width="4"/>
